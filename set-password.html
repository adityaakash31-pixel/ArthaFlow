<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Set Password - ArthaFlow</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="card">

<h2>🔐 Create Password</h2>

<p>
Google Login सफल है।<br>
अब अपने ArthaFlow account के लिए password बनाइए।
</p>

<input
type="password"
id="newPassword"
placeholder="Enter Password"
autocomplete="new-password">

<br><br>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
autocomplete="new-password">

<br><br>

<button
type="button"
onclick="setPassword()">

Create Password

</button>

</div>


<script type="module">

import {
    getAuth,
    onAuthStateChanged,
    EmailAuthProvider,
    linkWithCredential
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


let currentUser = null;


onAuthStateChanged(auth, function(user){

    if(!user){

        alert("Please login with Google first.");

        window.location.href =
            "login.html";

        return;

    }

    currentUser = user;

});


window.setPassword = async function(){

    if(!currentUser){

        alert("User not found. Please login again.");

        return;

    }


    const password =
        document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    if(password.length < 6){

        alert(
            "Password कम से कम 6 characters का होना चाहिए."
        );

        return;

    }


    if(password !== confirmPassword){

        alert(
            "Passwords match नहीं कर रहे हैं."
        );

        return;

    }


    try{

        const credential =
            EmailAuthProvider.credential(
                currentUser.email,
                password
            );


        await linkWithCredential(
            currentUser,
            credential
        );


        alert(
            "✅ Password created successfully!"
        );


        window.location.href =
            "splash.html";

    }

    catch(error){

        console.error(
            "PASSWORD LINK ERROR:",
            error
        );


        alert(
            "Password setup failed.\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );

    }

};

</script>

</body>

</html>
