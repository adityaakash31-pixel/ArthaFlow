<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GST Invoice Generator</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>🧾 GST Invoice Generator</h1>

<div class="card">

<h2>Invoice Details</h2>

<input
type="text"
id="invoiceNumber"
placeholder="Invoice Number"
readonly>

<input
type="date"
id="invoiceDate">

<input
type="date"
id="dueDate">

<input
type="text"
id="customerName"
placeholder="Customer Name">

<input
type="text"
id="customerMobile"
placeholder="Mobile Number">

<textarea
id="customerAddress"
placeholder="Customer Address"></textarea>

<input
type="text"
id="customerGST"
placeholder="GST Number (Optional)">

<button onclick="generateInvoiceNumber()">

🆔 Generate Invoice No

</button>

</div>

<div class="card">

<h2>Product Details</h2>

<input
type="text"
id="productName"
placeholder="Product / Service Name">

<input
type="number"
id="productQty"
placeholder="Quantity">

<input
type="number"
id="productRate"
placeholder="Rate">

<button onclick="calculateInvoiceAmount()">

💰 Calculate Amount

</button>

<p>

Subtotal :
<span id="invoiceSubtotal">₹0.00</span>

</p>

</div>

  <select id="gstPercent">

<option value="0">GST 0%</option>

<option value="5">GST 5%</option>

<option value="12">GST 12%</option>

<option value="18">GST 18%</option>

<option value="28">GST 28%</option>

</select>

<button onclick="calculateGST()">

🧾 Calculate GST

</button>

<hr>

<p>

CGST :
<span id="cgstAmount">₹0.00</span>

</p>

<p>

SGST :
<span id="sgstAmount">₹0.00</span>

</p>

<p>

IGST :
<span id="igstAmount">₹0.00</span>

</p>

<p>

Grand Total :
<span id="grandTotal">₹0.00</span>

</p>

<div class="card">

<h2>🏢 Company Details</h2>

<input
type="text"
id="companyName"
placeholder="Company Name">

<input
type="text"
id="companyGST"
placeholder="Company GST Number">

<input
type="text"
id="companyPhone"
placeholder="Company Phone">

<textarea
id="companyAddress"
placeholder="Company Address"></textarea>

<input
type="file"
id="companyLogo"
accept="image/*">

</div>

  <label>🏢 Company Logo</label>

<input
type="file"
id="companyLogo"
accept="image/*"
onchange="loadCompanyLogo()">

  <div class="card">

<h2>🧾 Invoice Preview</h2>

<div id="invoicePreview">

No Invoice Generated

</div>

<br>

<button onclick="previewInvoice()">

👀 Preview Invoice

</button>

<button onclick="downloadInvoicePDF()">

📄 Download PDF

</button>

</div>

  <div class="card">

<h2>📜 Invoice History</h2>

<div id="invoiceHistory">

No Invoice History

</div>

  </div>

  <div class="card">

<h2>🔍 Search Invoice</h2>

<input
type="text"
id="invoiceSearch"
placeholder="Search Invoice No / Customer Name"
onkeyup="searchInvoice()">

  </div>

<script src="js/script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>

</html>
