<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Manager</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="card">

<h2>🏦 Loan Manager</h2>

<p>Manage Borrowed & Lent Money</p>

<input
type="text"
id="loanPerson"
placeholder="Person / Bank Name">

<input
type="number"
id="loanAmount"
placeholder="Loan Amount">

<input
type="date"
id="loanDate">

  <input
type="date"
id="loanDueDate"
placeholder="Due Date">

<select id="loanType">

<option value="Borrowed">
Borrowed
</option>

<option value="Lent">
Lent
</option>

</select>

<textarea
id="loanNote"
placeholder="Description (Optional)"
rows="3">
</textarea>

<button onclick="saveLoan()">

💾 Save Loan

</button>

</div>

  <div class="card">

<h2>📊 Loan Summary</h2>

<p>
💸 Total Borrowed :
<span id="totalBorrowed">₹0</span>
</p>

<p>
💰 Total Lent :
<span id="totalLent">₹0</span>
</p>

<p>
✅ Total Paid :
<span id="totalPaid">₹0</span>
</p>

<p>
📋 Active Loans :
<span id="activeLoans">0</span>
</p>

    <div class="card">

<h2>📊 Loan Analytics</h2>

<p>
📋 Total Loans :
<span id="totalLoans">0</span>
</p>

<p>
📈 Average Loan :
<span id="avgLoan">₹0</span>
</p>

    </div>

  </div>

  <div class="card">

<h2>🔍 Search Loan</h2>

<input
type="text"
id="loanSearch"
placeholder="Search Person Name..."
onkeyup="searchLoan()">

  </div>

<div class="card">

<h2>📋 Loan History</h2>

<ul id="loanHistory">

<li>No Loan Records</li>

</ul>

</div>

<script src="js/script.js"></script>

</body>

</html>
