<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goal Tracker</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>🎯 Goal Tracker</h1>

<div id="goalContainer">

<div class="card">

<h2>🎯 Savings Goal Progress</h2>

<input
type="number"
id="goalTarget"
placeholder="Enter Goal Amount">

<input
type="number"
id="currentSaving"
placeholder="Current Savings">

<button onclick="calculateGoalProgress()">

📈 Calculate Progress

</button>

<hr>

<p>
🎯 Goal :
<span id="goalAmountDisplay">₹0</span>
</p>

<p>
💰 Current Saving :
<span id="currentSavingDisplay">₹0</span>
</p>

<p>
📊 Progress :
<span id="goalProgressPercent">0%</span>
</p>

<p>
🏆 Status :
<span id="goalStatus">
Not Calculated
</span>
</p>

</div>

</div>

  <div class="card">

<h2>⏳ Goal Achievement Predictor</h2>

<input
type="number"
id="monthlySaving"
placeholder="Monthly Saving">

<button onclick="predictGoalTime()">

⏳ Predict Time

</button>

<hr>

<p>
Remaining Amount :
<span id="remainingGoalAmount">₹0</span>
</p>

<p>
Estimated Time :
<span id="goalCompletionTime">0 Months</span>
</p>

<p>
AI Advice :
<span id="goalPredictionAdvice">
Not Calculated
</span>
</p>

  </div>

<script src="js/script.js"></script>

</body>

</html>
