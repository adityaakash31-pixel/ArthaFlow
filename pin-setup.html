<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Setup PIN</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="pin-page">

    <div class="pin-card">

        <img
            src="logo.png"
            alt="ArthaFlow"
            class="pin-logo"
            onerror="this.style.display='none'"
        >

        <h1>ArthaFlow</h1>

        <h2>🔐 Create App PIN</h2>

        <p>
            अपने ArthaFlow account को सुरक्षित रखने के लिए
            एक 4 या 6 digit PIN बनाइए।
        </p>

        <input
            type="password"
            id="newPin"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 4 or 6 Digit PIN"
        >

        <button
            type="button"
            onclick="savePin()">

            🔐 Save PIN

        </button>

        <div class="pin-footer">
            Your data. Your privacy. Your control.
        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- ArthaFlow Cloud Sync -->
<!-- ========================================== -->

<script
type="module"
src="js/cloud-sync.js">
</script>


<!-- ========================================== -->
<!-- Main JavaScript -->
<!-- ========================================== -->

<script
src="js/script.js">
</script>


</body>

</html>
