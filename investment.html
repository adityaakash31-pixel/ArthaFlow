<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Investment Tracker</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="card">

<h2>💰 Investment Tracker</h2>

<input
type="text"
id="investmentName"
placeholder="Investment Name">

<select id="investmentType">

<option>SIP</option>
<option>Mutual Fund</option>
<option>Stock</option>
<option>Gold</option>
<option>FD</option>
<option>RD</option>
<option>PPF</option>
<option>Crypto</option>

</select>

<input
type="number"
id="investmentAmount"
placeholder="Investment Amount">

<input
type="date"
id="investmentDate">

<button onclick="saveInvestment()">

💾 Save Investment

</button>

</div>

  <div class="card">

<h2>📊 Investment Summary</h2>

<p>
💰 Total Investment :
<span id="totalInvestment">₹0</span>
</p>

<p>
📋 Total Records :
<span id="totalInvestmentCount">0</span>
</p>

  </div>

  <div class="card">

<h2>📊 Investment Analytics</h2>

<canvas id="investmentChart"></canvas>

  </div>

  <div class="card">

<h2>📈 Profit / Loss Calculator</h2>

<input
type="number"
id="currentValue"
placeholder="Current Investment Value">

<button onclick="calculateROI()">

📊 Calculate ROI

</button>

<p>

💰 Profit / Loss :
<span id="profitLoss">₹0</span>

</p>

<p>

📈 ROI :
<span id="roiPercent">0%</span>

</p>

  </div>

<div class="card">

<h2>📋 Investment History</h2>

<ul id="investmentHistory">

<li>No Investment</li>

</ul>

</div>

<script src="js/script.js"></script>

</body>

</html>
