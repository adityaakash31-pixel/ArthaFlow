<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Management</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1>👨‍👩‍👧‍👦 Family Members</h1>

<div class="card">

<h2>Add Family Member</h2>

<input
type="text"
id="memberName"
placeholder="Member Name">

<button onclick="addFamilyMember()">

➕ Add Member

</button>

</div>

<div class="card">

<h2>Family List</h2>

<ul id="familyList">

<li>No Members Added</li>

</ul>

</div>

  <div class="card">

<h2>💰 Member Finance</h2>

<select id="memberSelect">

<option>Select Member</option>

</select>

<input
type="number"
id="memberIncome"
placeholder="Income">

<input
type="number"
id="memberExpense"
placeholder="Expense">

<button onclick="saveMemberFinance()">

💾 Save

</button>

  </div>

  <div class="card">

<h2>📊 Family Financial Report</h2>

<div id="familyFinanceReport">

No Data Available

</div>

<button onclick="loadFamilyFinanceReport()">

📊 Refresh Report

</button>

  </div>

  <div class="card">

<h2>👨‍👩‍👧‍👦 Family Total Summary</h2>

<p>
💰 Total Income :
<span id="familyTotalIncome">₹0</span>
</p>

<p>
💸 Total Expense :
<span id="familyTotalExpense">₹0</span>
</p>

<p>
💵 Total Balance :
<span id="familyTotalBalance">₹0</span>
</p>

<p>
👥 Total Members :
<span id="familyMemberCount">0</span>
</p>

<button onclick="loadFamilySummary()">

📊 Refresh Summary

</button>

  </div>

  <div class="card">

<h2>📊 Family Analytics</h2>

<canvas id="familyChart"></canvas>

  </div>

<script src="js/script.js"></script>

  <script>
window.addEventListener("load", function(){

loadFamilyMembers();

loadFamilyFinanceReport();

loadFamilySummary();

});
  </script>

</body>

</html>
