<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Tracker</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="card">

<h2>🏦 EMI Tracker</h2>

<input type="text"
id="bankName"
placeholder="Bank Name">

<input type="number"
id="loanAmount"
placeholder="Loan Amount">

<input type="number"
id="monthlyEMI"
placeholder="Monthly EMI">

<input type="date"
id="emiDueDate">

<button onclick="saveEMI()">
💾 Save EMI
</button>

</div>

  <div class="card">

<h2>📊 EMI Progress</h2>

<p>
💰 Total EMI :
<span id="totalEMI">₹0</span>
</p>

<p>
✅ Paid EMI :
<span id="paidEMI">₹0</span>
</p>

<p>
📉 Remaining EMI :
<span id="remainingEMI">₹0</span>
</p>

<div class="progress">

<div id="emiProgressBar" class="progress-fill">

0%

</div>

</div>

  </div>

  <div class="card">

<h2>🔔 EMI Reminder</h2>

<p>
Next EMI :
<span id="nextEMI">No EMI</span>
</p>

<p>
Status :
<span id="emiAlert">✅ No Pending EMI</span>
</p>

  </div>

  <div class="card">

<h2>📊 EMI Analytics</h2>

<canvas id="emiChart"></canvas>

  </div>

  <div class="card">

<h2>🏦 Bank Summary</h2>

<ul id="bankSummary">

<li>No EMI Data</li>

</ul>

  </div>

<div class="card">

<h2>📋 EMI History</h2>

<ul id="emiHistory">

<li>No EMI Records</li>

</ul>

</div>

<script src="js/script.js"></script>

</body>

</html>
