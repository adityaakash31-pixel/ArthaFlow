<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Create Account</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    font-family:Arial,sans-serif;
}

.box{
    width:90%;
    max-width:360px;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h2{
    text-align:center;
    margin-top:0;
    margin-bottom:22px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

.login{
    text-align:center;
    margin-top:18px;
    font-size:14px;
}

.login a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h2>✨ Create ArthaFlow Account</h2>

<form id="registerForm" autocomplete="off">

<label for="email">Email</label>

<input
    type="email"
    id="email"
    name="register_email"
    placeholder="Enter your email"
    autocomplete="off"
    required
>

<label for="username">User ID</label>

<input
    type="text"
    id="username"
    name="new_user_id"
    placeholder="Create your User ID"
    autocomplete="off"
    autocapitalize="none"
    required
>

<label for="password">Password</label>

<input
    type="password"
    id="password"
    name="new_password"
    placeholder="Create password"
    autocomplete="new-password"
    required
>

<label for="confirmPassword">Confirm Password</label>

<input
    type="password"
    id="confirmPassword"
    name="confirm_new_password"
    placeholder="Confirm password"
    autocomplete="new-password"
    required
>

<button type="submit" id="createBtn">
Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>


<script type="module">

import { auth } from "./js/firebase-config.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.7.1/firebase-auth.js";


console.log("Firebase Auth:", auth);


const form = document.getElementById("registerForm");

const button = document.getElementById("createBtn");


form.addEventListener("submit", async function(event){

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(!email || !username || !password || !confirmPassword){

        alert("सभी जानकारी भरें।");
        return;

    }


    if(password !== confirmPassword){

        alert("Password और Confirm Password अलग हैं।");
        return;

    }


    if(password.length < 6){

        alert("Password कम से कम 6 characters का होना चाहिए।");
        return;

    }


    button.disabled = true;

    button.textContent = "Creating Account...";


    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "Account Created:",
            userCredential.user.uid
        );


        alert(
            "✅ Account successfully created!\n\n" +
            "अब Login करें।"
        );


        window.location.href = "login.html";


    }catch(error){

        console.error(
            "Firebase Error:",
            error
        );


        if(error.code === "auth/email-already-in-use"){

            alert("यह Email पहले से registered है।");

        }
        else if(error.code === "auth/invalid-email"){

            alert("Email सही नहीं है।");

        }
        else if(error.code === "auth/weak-password"){

            alert("Password बहुत कमजोर है। कम से कम 6 characters रखें।");

        }
        else{

            alert(
                "Account create नहीं हुआ।\n\n" +
                error.code + "\n" +
                error.message
            );

        }


        button.disabled = false;

        button.textContent = "Create Account";

    }

});

</script>

</body>
</html>
