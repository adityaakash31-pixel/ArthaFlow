<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>

<style>

/* =====================================================
   ARTHAFLOW PREMIUM LOGIN
   DESIGN ONLY — FUNCTIONS UNCHANGED
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(59,130,246,0.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(124,58,237,0.18),
            transparent 34%
        ),
        linear-gradient(
            135deg,
            #07111f,
            #101b32 48%,
            #17152f
        );

    overflow:hidden;

}


/* =====================================================
   BACKGROUND DECORATION
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
        rgba(59,130,246,0.13);

    filter:blur(5px);

    top:-120px;
    right:-80px;

    pointer-events:none;

}

body::after{

    content:"";

    position:fixed;

    width:240px;
    height:240px;

    border-radius:50%;

    background:
        rgba(139,92,246,0.12);

    filter:blur(8px);

    bottom:-110px;
    left:-80px;

    pointer-events:none;

}


/* =====================================================
   MAIN CARD
===================================================== */

.login-card{

    position:relative;

    width:100%;
    max-width:430px;

    padding:38px 32px 30px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.97),
            rgba(248,250,252,0.94)
        );

    border:1px solid
        rgba(255,255,255,0.72);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,0.35),
        0 0 0 1px
        rgba(255,255,255,0.04);

    backdrop-filter:blur(18px);

    text-align:center;

    z-index:2;

}


/* =====================================================
   TOP ACCENT
===================================================== */

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:12%;

    width:76%;
    height:3px;

    border-radius:0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #06b6d4,
            #7c3aed
        );

}


/* =====================================================
   REAL ARTHAFLOW LOGO FRAME
===================================================== */

.logo-wrap{

    width:96px;
    height:96px;

    margin:0 auto 18px;

    padding:5px;

    border-radius:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4 48%,
            #7c3aed
        );

    box-shadow:
        0 15px 35px
        rgba(37,99,235,0.30),
        0 0 30px
        rgba(99,102,241,0.12);

}


/* =====================================================
   REAL LOGO IMAGE
===================================================== */

.logo-image{

    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    padding:7px;

    border-radius:23px;

    background:#ffffff;

}


/* =====================================================
   BRAND
===================================================== */

.brand-name{

    font-size:31px;

    font-weight:800;

    letter-spacing:-1px;

    color:#0f172a;

    margin-bottom:5px;

}

.brand-name span{

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.subtitle{

    font-size:13px;

    color:#64748b;

    letter-spacing:0.3px;

    margin-bottom:28px;

}


/* =====================================================
   INPUT
===================================================== */

.input-group{

    text-align:left;

    margin-bottom:16px;

}

.input-group label{

    display:block;

    margin-bottom:7px;

    padding-left:3px;

    font-size:12px;

    font-weight:700;

    color:#334155;

    letter-spacing:0.2px;

}

.input-box{

    position:relative;

}

.input-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    font-size:17px;

    opacity:0.75;

    pointer-events:none;

}

.input-group input{

    width:100%;

    height:54px;

    padding:
        0 16px 0 46px;

    border:1px solid
        #dbe3ef;

    border-radius:15px;

    outline:none;

    background:#f8fafc;

    color:#0f172a;

    font-size:15px;

    transition:
        border 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;

}

.input-group input::placeholder{

    color:#94a3b8;

}

.input-group input:focus{

    background:#ffffff;

    border-color:#6366f1;

    box-shadow:
        0 0 0 4px
        rgba(99,102,241,0.10),
        0 8px 20px
        rgba(15,23,42,0.05);

    transform:
        translateY(-1px);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

#loginBtn{

    position:relative;

    width:100%;

    height:54px;

    margin-top:5px;

    border:0;

    border-radius:15px;

    color:white;

    font-size:15px;

    font-weight:750;

    letter-spacing:0.2px;

    cursor:pointer;

    overflow:hidden;

    background:
        linear-gradient(
            100deg,
            #2563eb,
            #4f46e5,
            #7c3aed
        );

    box-shadow:
        0 12px 25px
        rgba(79,70,229,0.28);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;

}

#loginBtn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.22),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left 0.6s ease;

}

#loginBtn:hover::before{

    left:130%;

}

#loginBtn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 16px 30px
        rgba(79,70,229,0.34);

}

#loginBtn:active{

    transform:
        translateY(0);

}

#loginBtn:disabled{

    opacity:0.65;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
   DIVIDER
===================================================== */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:24px 0;

    color:#94a3b8;

    font-size:11px;

    font-weight:700;

    letter-spacing:1px;

}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #dbe3ef
        );

}

.divider::after{

    background:
        linear-gradient(
            90deg,
            #dbe3ef,
            transparent
        );

}


/* =====================================================
   GOOGLE BUTTON
===================================================== */

#googleLoginBtn{

    width:100%;

    height:54px;

    border:1px solid
        #dbe3ef;

    border-radius:15px;

    background:#ffffff;

    color:#1e293b;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 6px 15px
        rgba(15,23,42,0.05);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;

}

#googleLoginBtn:hover{

    background:#f8fafc;

    border-color:#cbd5e1;

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 20px
        rgba(15,23,42,0.08);

}

#googleLoginBtn:active{

    transform:
        translateY(0);

}

#googleLoginBtn:disabled{

    opacity:0.65;

    cursor:not-allowed;

}


/* =====================================================
   SECURITY BADGE
===================================================== */

.security-badge{

    display:inline-flex;

    align-items:center;

    gap:6px;

    margin-top:22px;

    padding:7px 11px;

    border-radius:30px;

    background:#f1f5f9;

    color:#64748b;

    font-size:10px;

    font-weight:600;

}

.security-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:
        0 0 0 3px
        rgba(34,197,94,0.12);

}


/* =====================================================
   FOOTER
===================================================== */

.login-footer{

    margin-top:15px;

    font-size:11px;

    color:#94a3b8;

}

.login-footer strong{

    color:#6366f1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    body{

        padding:14px;

        overflow:auto;

    }

    .login-card{

        max-width:400px;

        padding:
            34px 21px 27px;

        border-radius:25px;

    }

    .logo-wrap{

        width:88px;
        height:88px;

        border-radius:25px;

        padding:5px;

    }

    .logo-image{

        border-radius:20px;

        padding:6px;

    }

    .brand-name{

        font-size:28px;

    }

    .subtitle{

        margin-bottom:24px;

    }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media(max-height:650px){

    body{

        align-items:flex-start;

        padding-top:15px;

        padding-bottom:15px;

    }

    .login-card{

        padding-top:28px;

    }

    .logo-wrap{

        width:76px;
        height:76px;

        margin-bottom:12px;

    }

    .logo-image{

        padding:5px;

    }

    .brand-name{

        font-size:25px;

    }

    .subtitle{

        margin-bottom:18px;

    }

}

</style>

</head>


<body>


<div class="login-card">


    <!-- =================================================
         REAL ARTHAFLOW LOGO
    ================================================== -->

    <div class="logo-wrap">

        <img
            src="logo-transparent.png"
            alt="ArthaFlow Logo"
            class="logo-image">

    </div>


    <!-- =================================================
         BRAND
    ================================================== -->

    <h2 class="brand-name">
        <span>Artha</span>Flow
    </h2>

    <p class="subtitle">
        Smart Finance Management
    </p>


    <!-- =================================================
         EMAIL
    ================================================== -->

    <div class="input-group">

        <label for="email">
            Email Address
        </label>

        <div class="input-box">

            <span class="input-icon">
                ✉
            </span>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email">

        </div>

    </div>


    <!-- =================================================
         PASSWORD
    ================================================== -->

    <div class="input-group">

        <label for="password">
            Password
        </label>

        <div class="input-box">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password">

        </div>

    </div>


    <!-- =================================================
         LOGIN
    ================================================== -->

    <button
        id="loginBtn"
        type="button">

        Login

    </button>


    <!-- =================================================
         DIVIDER
    ================================================== -->

    <div class="divider">

        <span>OR</span>

    </div>


    <!-- =================================================
         GOOGLE LOGIN
    ================================================== -->

    <button
        id="googleLoginBtn"
        type="button">

        🔵 &nbsp; Continue with Google

    </button>


    <!-- =================================================
         SECURITY
    ================================================== -->

    <div class="security-badge">

        <span class="security-dot"></span>

        Secure Firebase Authentication

    </div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="login-footer">

        Secure login for
        <strong>ArthaFlow</strong>

    </div>


</div>



<!-- =====================================================
     FIREBASE — ORIGINAL FUNCTIONS UNCHANGED
===================================================== -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


/* ===============================
   Firebase Configuration
   =============================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"
};


/* ===============================
   Firebase Initialize
   =============================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const googleProvider =
    new GoogleAuthProvider();


console.log(
    "✅ ArthaFlow Firebase Auth Ready"
);


/* ===============================
   Email + Password Login
================================ */

document
.getElementById("loginBtn")
.addEventListener("click", async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        alert("Email डालिए");

        return;

    }


    if(!password){

        alert("Password डालिए");

        return;

    }


    const button =
        document.getElementById("loginBtn");


    button.disabled = true;

    button.innerText =
        "Logging in...";


    try{

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "LOGIN SUCCESS:",
            result.user.email
        );


        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        /* User information */

        localStorage.setItem(
            "userEmail",
            result.user.email || ""
        );

        localStorage.setItem(
            "userName",
            result.user.displayName || ""
        );


        alert(
            "Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        alert(
            "Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText =
            "Login";

    }

});


/* ===============================
   Google Login
   Phase 11A - Step 4.2
================================ */

document
.getElementById("googleLoginBtn")
.addEventListener("click", async function(){

    const button =
        document.getElementById(
            "googleLoginBtn"
        );


    button.disabled = true;

    button.innerText =
        "Connecting to Google...";


    try{

        const result =
            await signInWithPopup(
                auth,
                googleProvider
            );


        const user =
            result.user;


        console.log(
            "GOOGLE LOGIN SUCCESS:",
            user.email
        );


        /* Login Status */

        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        /* User Information */

        localStorage.setItem(
            "userEmail",
            user.email || ""
        );

        localStorage.setItem(
            "userName",
            user.displayName || ""
        );

        localStorage.setItem(
            "userPhoto",
            user.photoURL || ""
        );

        localStorage.setItem(
            "firebaseUID",
            user.uid || ""
        );


        alert(
            "✅ Google Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        console.error(
            "GOOGLE LOGIN ERROR:",
            error
        );


        alert(
            "Google Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText =
            "🔵 Continue with Google";

    }

});

</script>

</body>

</html>
