<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    padding:30px;
    width:320px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.login-logo{
    width:100px;
    height:100px;
    object-fit:contain;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

h2{
    margin-bottom:20px;
}

a{
    color:#2563eb;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<img
src="login-logo.png"
alt="ArthaFlow Login Logo"
class="login-logo">

<h2>ArthaFlow Login</h2>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="email">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

<button
id="loginBtn"
onclick="login()">

Login

</button>

<p style="margin-top:15px;">
New user?
<a href="register.html">Create Account</a>
</p>

<p>
<a href="#" onclick="forgotPassword(); return false;">
Forgot Password?
</a>
</p>

</div>


<script type="module">

import { auth } from "./js/firebase-config.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.7.1/firebase-auth.js";


window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginBtn");


    if(!email || !password){

        alert("Email और Password भरें");
        return;

    }


    button.disabled = true;
    button.innerText = "Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        /*
         * Login successful
         */

        sessionStorage.setItem(
            "loggedIn",
            "true"
        );

        sessionStorage.removeItem(
            "pinVerified"
        );


        window.location.href =
            "splash.html";


    }catch(error){

        console.error(error);

        if(error.code === "auth/invalid-credential"){

            alert(
                "Email या Password गलत है."
            );

        }
        else if(error.code === "auth/user-not-found"){

            alert(
                "इस Email से कोई account नहीं मिला."
            );

        }
        else if(error.code === "auth/wrong-password"){

            alert(
                "Password गलत है."
            );

        }
        else{

            alert(
                "Login नहीं हुआ: " +
                error.message
            );

        }

    }finally{

        button.disabled = false;
        button.innerText = "Login";

    }

};


window.forgotPassword = async function(){

    const email =
        document.getElementById("email").value.trim();


    if(!email){

        alert(
            "पहले अपना Email डालें."
        );

        return;

    }


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        alert(
            "Password reset link आपके Email पर भेज दिया गया है."
        );

    }catch(error){

        console.error(error);

        alert(
            "Reset Email नहीं भेजा गया: " +
            error.message
        );

    }

};

</script>

</body>
</html>
