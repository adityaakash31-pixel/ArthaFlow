<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    padding:30px;
    width:320px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.login-logo{
    width:100px;
    height:100px;
    object-fit:contain;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

a{
    color:#2563eb;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<img
src="login-logo.png"
alt="ArthaFlow Login Logo"
class="login-logo">

<h2>ArthaFlow Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button
id="loginBtn"
type="button">

Login

</button>

<p>
New user?
<a href="register.html">Create Account</a>
</p>

<p>
<a href="#" id="forgotPassword">
Forgot Password?
</a>
</p>

</div>


<script>

/* =================================
   BASIC JAVASCRIPT TEST
================================= */

alert("LOGIN PAGE JAVASCRIPT WORKING");


document
.getElementById("loginBtn")
.addEventListener("click", function(){

    alert("LOGIN BUTTON WORKING");

});


document
.getElementById("forgotPassword")
.addEventListener("click", function(event){

    event.preventDefault();

    alert("FORGOT PASSWORD BUTTON WORKING");

});

</script>

</body>

</html>
