<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>

<style>

/* =========================================
   ArthaFlow Premium Login UI
   Design Only - No Login Function Changed
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #dbeafe 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #ede9fe 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );

}


/* =========================================
   Login Card
========================================= */

.login-card{

    width:100%;
    max-width:420px;

    padding:38px 30px 32px;

    background:rgba(255,255,255,0.92);

    border:1px solid
        rgba(255,255,255,0.8);

    border-radius:26px;

    box-shadow:
        0 20px 55px
        rgba(15,23,42,0.13);

    backdrop-filter:blur(12px);

    text-align:center;

}


/* =========================================
   Logo
========================================= */

.logo{

    width:70px;
    height:70px;

    margin:0 auto 18px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:30px;
    font-weight:800;

    box-shadow:
        0 10px 25px
        rgba(37,99,235,0.28);

}


/* =========================================
   Heading
========================================= */

h2{

    font-size:30px;

    letter-spacing:-0.8px;

    color:#111827;

    margin-bottom:7px;

}

.subtitle{

    color:#64748b;

    font-size:14px;

    margin-bottom:28px;

}


/* =========================================
   Input Group
========================================= */

.input-group{

    text-align:left;

    margin-bottom:17px;

}

.input-group label{

    display:block;

    font-size:13px;

    font-weight:600;

    color:#374151;

    margin-bottom:7px;

}

.input-group input{

    width:100%;

    height:52px;

    padding:0 16px;

    border:1px solid #dbe2ea;

    border-radius:14px;

    background:#f8fafc;

    color:#111827;

    font-size:15px;

    outline:none;

    transition:
        0.25s ease;

}

.input-group input::placeholder{

    color:#94a3b8;

}

.input-group input:focus{

    border-color:#6366f1;

    background:white;

    box-shadow:
        0 0 0 4px
        rgba(99,102,241,0.10);

}


/* =========================================
   Login Button
========================================= */

#loginBtn{

    width:100%;

    height:52px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #6366f1
        );

    color:white;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 9px 20px
        rgba(37,99,235,0.22);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;

}

#loginBtn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 13px 25px
        rgba(37,99,235,0.28);

}

#loginBtn:active{

    transform:translateY(0);

}

#loginBtn:disabled{

    opacity:0.65;

    cursor:not-allowed;

    transform:none;

}


/* =========================================
   Divider
========================================= */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:25px 0;

    color:#94a3b8;

    font-size:13px;

}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#e2e8f0;

}


/* =========================================
   Google Button
========================================= */

#googleLoginBtn{

    width:100%;

    height:52px;

    border:1px solid #dbe2ea;

    border-radius:14px;

    background:white;

    color:#1f2937;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:
        0.2s ease;

}

#googleLoginBtn:hover{

    background:#f8fafc;

    border-color:#cbd5e1;

    transform:translateY(-1px);

}

#googleLoginBtn:active{

    transform:translateY(0);

}

#googleLoginBtn:disabled{

    opacity:0.65;

    cursor:not-allowed;

}


/* =========================================
   Footer
========================================= */

.login-footer{

    margin-top:25px;

    font-size:12px;

    color:#94a3b8;

}

.login-footer strong{

    color:#6366f1;

}


/* =========================================
   Mobile
========================================= */

@media(max-width:480px){

    body{

        padding:15px;

    }

    .login-card{

        padding:
            32px 22px 27px;

        border-radius:22px;

    }

    h2{

        font-size:27px;

    }

    .logo{

        width:64px;
        height:64px;

        font-size:27px;

    }

}

</style>

</head>


<body>


<div class="login-card">


    <!-- Logo -->

    <div class="logo">
        AF
    </div>


    <h2>ArthaFlow</h2>

    <p class="subtitle">
        Smart Finance Management
    </p>


    <!-- Email -->

    <div class="input-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email">

    </div>


    <!-- Password -->

    <div class="input-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password">

    </div>


    <!-- Login -->

    <button
        id="loginBtn"
        type="button">

        Login

    </button>


    <!-- Divider -->

    <div class="divider">
        <span>OR</span>
    </div>


    <!-- Google Login -->

    <button
        id="googleLoginBtn"
        type="button">

        🔵 Continue with Google

    </button>


    <!-- Footer -->

    <div class="login-footer">

        Secure login for
        <strong>ArthaFlow</strong>

    </div>


</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


/* ===============================
   Firebase Configuration
   =============================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"
};


/* ===============================
   Firebase Initialize
   =============================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const googleProvider =
    new GoogleAuthProvider();


console.log(
    "✅ ArthaFlow Firebase Auth Ready"
);


/* ===============================
   Email + Password Login
================================ */

document
.getElementById("loginBtn")
.addEventListener("click", async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        alert("Email डालिए");

        return;

    }


    if(!password){

        alert("Password डालिए");

        return;

    }


    const button =
        document.getElementById("loginBtn");


    button.disabled = true;

    button.innerText =
        "Logging in...";


    try{

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "LOGIN SUCCESS:",
            result.user.email
        );


        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        /* User information */

        localStorage.setItem(
            "userEmail",
            result.user.email || ""
        );

        localStorage.setItem(
            "userName",
            result.user.displayName || ""
        );


        alert(
            "Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        alert(
            "Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText =
            "Login";

    }

});


/* ===============================
   Google Login
   Phase 11A - Step 4.2
================================ */

document
.getElementById("googleLoginBtn")
.addEventListener("click", async function(){

    const button =
        document.getElementById(
            "googleLoginBtn"
        );


    button.disabled = true;

    button.innerText =
        "Connecting to Google...";


    try{

        const result =
            await signInWithPopup(
                auth,
                googleProvider
            );


        const user =
            result.user;


        console.log(
            "GOOGLE LOGIN SUCCESS:",
            user.email
        );


        /* Login Status */

        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        /* User Information */

        localStorage.setItem(
            "userEmail",
            user.email || ""
        );

        localStorage.setItem(
            "userName",
            user.displayName || ""
        );

        localStorage.setItem(
            "userPhoto",
            user.photoURL || ""
        );

        localStorage.setItem(
            "firebaseUID",
            user.uid || ""
        );


        alert(
            "✅ Google Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        console.error(
            "GOOGLE LOGIN ERROR:",
            error
        );


        alert(
            "Google Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText =
            "🔵 Continue with Google";

    }

});

</script>

</body>

</html>
