<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    padding:30px;
    width:320px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.login-logo{
    width:100px;
    height:100px;
    object-fit:contain;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

a{
    color:#2563eb;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<img
src="login-logo.png"
alt="ArthaFlow Login Logo"
class="login-logo">

<h2>ArthaFlow Login</h2>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="email">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

<button
id="loginBtn"
type="button"
onclick="loginUser()">

Login

</button>

<p>
New user?
<a href="register.html">Create Account</a>
</p>

<p>
<a href="#"
onclick="forgotPassword(); return false;">
Forgot Password?
</a>
</p>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.7.1/firebase-auth-compat.js"></script>


<script>

/* =====================================
   ARTHAFLOW FIREBASE LOGIN
===================================== */

console.log("ArthaFlow Login JavaScript Started");


const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"

};


/* =====================================
   FIREBASE INITIALIZE
===================================== */

try{

    firebase.initializeApp(firebaseConfig);

    console.log("Firebase initialized");

}

catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

    alert(
        "Firebase शुरू नहीं हो पाया:\n\n" +
        error.message
    );

}


const auth = firebase.auth();


/* =====================================
   LOGIN
===================================== */

async function loginUser(){

    console.log("LOGIN BUTTON CLICKED");

    alert("LOGIN BUTTON WORKING");


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        alert("Email डालिए");

        return;

    }


    if(!password){

        alert("Password डालिए");

        return;

    }


    const button =
        document.getElementById("loginBtn");


    button.disabled = true;

    button.innerText =
        "Logging in...";


    /* =================================
       30 SECOND SAFETY TIMEOUT
    ================================= */

    let completed = false;


    const timeout =
        setTimeout(function(){

            if(!completed){

                button.disabled = false;

                button.innerText =
                    "Login";


                alert(
                    "Firebase से response नहीं आया।\n\n" +
                    "Internet connection और Firebase configuration check करें।"
                );

            }

        },30000);


    try{

        console.log(
            "Trying Firebase login..."
        );


        const userCredential =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        completed = true;

        clearTimeout(timeout);


        console.log(
            "LOGIN SUCCESS:",
            userCredential.user.email
        );


        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        alert(
            "Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        completed = true;

        clearTimeout(timeout);


        console.error(
            "FIREBASE LOGIN ERROR:",
            error
        );


        button.disabled = false;

        button.innerText =
            "Login";


        alert(
            "LOGIN ERROR\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            "Message: " +
            error.message
        );

    }

}


/* =====================================
   FORGOT PASSWORD
===================================== */

async function forgotPassword(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    if(!email){

        alert(
            "पहले Email डालिए।"
        );

        return;

    }


    try{

        await auth.sendPasswordResetEmail(
            email
        );


        alert(
            "Password reset link आपके Email पर भेज दिया गया है।"
        );

    }

    catch(error){

        console.error(
            "PASSWORD RESET ERROR:",
            error
        );


        alert(
            "Password reset नहीं हुआ।\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            "Message: " +
            error.message
        );

    }

}

</script>

</body>

</html>
