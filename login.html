<!DOCTYPE html>  <html lang="en">  <head>  <meta charset="UTF-8">  <meta name="viewport"  
content="width=device-width, initial-scale=1.0">

<title>ArthaFlow Login</title>  </head>  <body>  <div class="login-page">

    <div class="login-card">

        <div class="brand">

            <img
                src="logo.png"
                alt="ArthaFlow"
                class="brand-logo"
                onerror="this.style.display='none'"
            >

            <h1>ArthaFlow</h1>

            <p>Smart Finance Manager</p>

        </div>

        <div class="welcome">

            <h2>Welcome Back 👋</h2>

            <p>Login to manage your finances</p>

        </div>

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>

        <div class="input-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

        </div>

        <div class="forgot-row">

            <a href="#" id="forgotPassword">
                🔐 Forgot Password?
            </a>

        </div>

        <button
            id="loginBtn"
            type="button"
            class="primary-btn">

            🔐 Login

        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <button
            id="googleLoginBtn"
            type="button"
            class="google-btn">

            🔵 Continue with Google

        </button>

        <div class="create-section">

            <p>Don't have an account?</p>

            <button
                type="button"
                class="create-btn"
                onclick="window.location.href='create-account.html'">

                📝 Create Account

            </button>

        </div>

        <div class="login-footer">

            <span>💎 ArthaFlow Premium</span>

            <small>Track • Save • Invest • Grow</small>

        </div>

    </div>

</div>

<script type="module">  
  
import { initializeApp }  
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";  
  
import {  
    getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail,
GoogleAuthProvider,
signInWithPopup
}  
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";  
  
  
/* ===============================  
   Firebase Configuration  
   =============================== */  
  
const firebaseConfig = {  
  
    apiKey:  
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",  
  
    authDomain:  
    "arthaflow-4d670.firebaseapp.com",  
  
    projectId:  
    "arthaflow-4d670",  
  
    storageBucket:  
    "arthaflow-4d670.firebasestorage.app",  
  
    messagingSenderId:  
    "417281404304",  
  
    appId:  
    "1:417281404304:web:a0b9fa5a787ad0426d5715",  
  
    measurementId:  
    "G-785TXW9WTL"  
};  
  
  
/* ===============================  
   Firebase Initialize  
   =============================== */  
  
const app =  
    initializeApp(firebaseConfig);  
  
const auth =  
    getAuth(app);  
  
const googleProvider =  
    new GoogleAuthProvider();  
  
  
console.log(  
    "✅ ArthaFlow Firebase Auth Ready"  
);  
  
  
/* ===============================  
   Email + Password Login  
   =============================== */  
  
document  
.getElementById("loginBtn")  
.addEventListener("click", async function(){  
  
    const email =  
        document  
        .getElementById("email")  
        .value  
        .trim();  
  
    const password =  
        document  
        .getElementById("password")  
        .value;  
  
  
    if(!email){  
  
        alert("Email डालिए");  
  
        return;  
  
    }  
  
  
    if(!password){  
  
        alert("Password डालिए");  
  
        return;  
  
    }  
  
  
    const button =  
        document.getElementById("loginBtn");  
  
  
    button.disabled = true;  
  
    button.innerText =  
        "Logging in...";  
  
  
    try{  
  
        const result =  
            await signInWithEmailAndPassword(  
                auth,  
                email,  
                password  
            );  
  
  
        console.log(  
            "LOGIN SUCCESS:",  
            result.user.email  
        );  
  
  
        sessionStorage.setItem(  
            "loggedIn",  
            "true"  
        );  
  
  
        sessionStorage.removeItem(  
            "pinVerified"  
        );  
  
  
        /* User information */  
  
        localStorage.setItem(  
            "userEmail",  
            result.user.email || ""  
        );  
  
        localStorage.setItem(  
            "userName",  
            result.user.displayName || ""  
        );  
  
  
        alert(
    "✅ Login Successfully!"
);

window.location.href =
    "splash.html"; 
  
    }  
  
    catch(error){  
  
        console.error(  
            "LOGIN ERROR:",  
            error  
        );  
  
  
        alert(  
            "Login Error\n\n" +  
            "Code: " +  
            error.code +  
            "\n\n" +  
            error.message  
        );  
  
  
        button.disabled = false;  
  
        button.innerText =  
            "Login";  
  
    }  
  
});  
  
  
/* ===============================  
   Google Login  
   Phase 11A - Step 4.2  
   =============================== */  
  
document  
.getElementById("googleLoginBtn")  
.addEventListener("click", async function(){  
  
    const button =  
        document.getElementById(  
            "googleLoginBtn"  
        );  
  
  
    button.disabled = true;  
  
    button.innerText =  
        "Connecting to Google...";  
  
  
    try{  
  
        const result =  
            await signInWithPopup(  
                auth,  
                googleProvider  
            );  
  
  
        const user =  
            result.user;  
  
  
        console.log(  
            "GOOGLE LOGIN SUCCESS:",  
            user.email  
        );  
  
  
        /* Login Status */  
  
        sessionStorage.setItem(  
            "loggedIn",  
            "true"  
        );  
  
  
        sessionStorage.removeItem(  
            "pinVerified"  
        );  
  
  
        /* User information */

localStorage.setItem(
    "userEmail",
    result.user.email || ""
);

localStorage.setItem(
    "userName",
    result.user.displayName || ""
);

localStorage.setItem(
    "firebaseUID",
    result.user.uid || ""
);
  
        localStorage.setItem(  
            "userPhoto",  
            user.photoURL || ""  
        );  
  
        localStorage.setItem(  
            "firebaseUID",  
            user.uid || ""  
        );  
  
  
        alert(
    "✅ Google Login Successfully!"
);

window.location.href =
    "set-password.html";
  
  
    }  
  
    catch(error){

    alert(
        "GOOGLE ERROR\n\n" +
        "Code: " +
        error.code +
        "\n\nMessage: " +
        error.message
    );

    console.error(
        "GOOGLE LOGIN ERROR:",
        error
    );

    button.disabled = false;

    button.innerText =
        "🔵 Continue with Google";
    }
  
});  

  /* ===============================
   Forgot Password
   =============================== */

document
.getElementById("forgotPassword")
.addEventListener("click", async function(event){

    event.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    if(!email){

        alert(
            "पहले अपना Email डालिए।"
        );

        document
        .getElementById("email")
        .focus();

        return;

    }

    try{

        await sendPasswordResetEmail(
            auth,
            email
        );

        alert(
            "✅ Password reset email भेज दिया गया है।\n\n" +
            "अपना email inbox और Spam folder check करें।"
        );

    }

    catch(error){

        console.error(
            "FORGOT PASSWORD ERROR:",
            error
        );

        alert(
            "Password reset failed.\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );

    }

});
  
</script> 
</body> 
</html>
