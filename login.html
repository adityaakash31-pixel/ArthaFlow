<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArthaFlow Login</title>
</head>

<body>

<h2>ArthaFlow Login</h2>

<input type="email" id="email" placeholder="Email">
<br><br>

<input type="password" id="password" placeholder="Password">
<br><br>

<button id="loginBtn" type="button">
Login
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


console.log("ArthaFlow Firebase Auth Ready");


document
.getElementById("loginBtn")
.addEventListener("click", async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        alert("Email डालिए");

        return;

    }


    if(!password){

        alert("Password डालिए");

        return;

    }


    const button =
        document.getElementById("loginBtn");


    button.disabled = true;

    button.innerText =
        "Logging in...";


    try{

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        console.log(
            "LOGIN SUCCESS:",
            result.user.email
        );


        sessionStorage.setItem(
            "loggedIn",
            "true"
        );


        sessionStorage.removeItem(
            "pinVerified"
        );


        alert(
            "Login Successfully!"
        );


        window.location.href =
            "splash.html";


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        alert(
            "Login Error\n\n" +
            "Code: " +
            error.code +
            "\n\n" +
            error.message
        );


        button.disabled = false;

        button.innerText =
            "Login";

    }

});

</script>
</body>
</html>
