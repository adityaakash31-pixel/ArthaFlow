<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Change Password - ArthaFlow</title>

<link rel="stylesheet"
      href="css/style.css">

</head>


<body>


<div class="card">

    <h2>🔐 Change Password</h2>

    <p>
        Change your ArthaFlow account password.
    </p>


    <!-- Current Password -->

    <input
        type="password"
        id="currentPassword"
        placeholder="Current Password">


    <br><br>


    <!-- New Password -->

    <input
        type="password"
        id="newPassword"
        placeholder="New Password">


    <br><br>


    <!-- Confirm Password -->

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password">


    <br><br>


    <!-- Change Password -->

    <button
        type="button"
        id="changePasswordBtn">

        🔐 Change Password

    </button>


    <br><br>


    <!-- Back -->

    <button
        type="button"
        onclick="window.location.href='settings.html'">

        ← Back to Settings

    </button>

</div>



<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getAuth,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



/* ===============================
   Firebase Configuration
   =============================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDM8WtiKL5hSSoDH4BoacMUIQ3QVSpjxJI",

    authDomain:
    "arthaflow-4d670.firebaseapp.com",

    projectId:
    "arthaflow-4d670",

    storageBucket:
    "arthaflow-4d670.firebasestorage.app",

    messagingSenderId:
    "417281404304",

    appId:
    "1:417281404304:web:a0b9fa5a787ad0426d5715",

    measurementId:
    "G-785TXW9WTL"

};



/* ===============================
   Firebase Initialize
   =============================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);



/* ===============================
   Change Password
   =============================== */

document
.getElementById("changePasswordBtn")
.addEventListener("click", async function(){


    const currentPassword =
        document
        .getElementById("currentPassword")
        .value;


    const newPassword =
        document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;



    /* ===============================
       Validation
       =============================== */

    if(!currentPassword){

        alert(
            "Please enter your current password."
        );

        return;

    }


    if(!newPassword){

        alert(
            "Please enter a new password."
        );

        return;

    }


    if(newPassword.length < 6){

        alert(
            "New password must contain at least 6 characters."
        );

        return;

    }


    if(newPassword !== confirmPassword){

        alert(
            "New passwords do not match."
        );

        return;

    }


    if(currentPassword === newPassword){

        alert(
            "New password must be different from your current password."
        );

        return;

    }



    /* ===============================
       Current User
       =============================== */

    const user =
        auth.currentUser;


    if(!user){

        alert(
            "Session expired. Please login again."
        );

        window.location.href =
            "login.html";

        return;

    }



    /* ===============================
       Email/Password Check
       =============================== */

    if(!user.email){

        alert(
            "Password change is not available for this account."
        );

        return;

    }



    const button =
        document.getElementById(
            "changePasswordBtn"
        );


    button.disabled = true;

    button.innerText =
        "Changing Password...";



    try{


        /* ===============================
           Re-authenticate User
           =============================== */

        const credential =
            EmailAuthProvider.credential(
                user.email,
                currentPassword
            );


        await reauthenticateWithCredential(
            user,
            credential
        );



        /* ===============================
           Update Password
           =============================== */

        await updatePassword(
            user,
            newPassword
        );



        alert(
            "✅ Password changed successfully!"
        );



        /* Clear fields */

        document
        .getElementById("currentPassword")
        .value = "";


        document
        .getElementById("newPassword")
        .value = "";


        document
        .getElementById("confirmPassword")
        .value = "";



        /* Back to Settings */

        window.location.href =
            "settings.html";


    }


    catch(error){

        console.error(
            "CHANGE PASSWORD ERROR:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            alert(
                "❌ Current password is incorrect."
            );

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            alert(
                "❌ Current password is incorrect."
            );

        }

        else if(
            error.code ===
            "auth/weak-password"
        ){

            alert(
                "❌ New password is too weak."
            );

        }

        else if(
            error.code ===
            "auth/requires-recent-login"
        ){

            alert(
                "🔐 Please login again and then change your password."
            );

        }

        else{

            alert(
                "Password change failed.\n\n" +
                "Code: " +
                error.code
            );

        }


        button.disabled = false;

        button.innerText =
            "🔐 Change Password";

    }

});

</script>


</body>

</html>
