<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PIN Lock</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="pin-page">

    <div class="pin-card">

        <img
            src="logo.png"
            alt="ArthaFlow"
            class="pin-logo"
            onerror="this.style.display='none'"
        >

        <h1>ArthaFlow</h1>

        <h2>🔐 Enter App PIN</h2>

        <p>
            अपना PIN डालकर ArthaFlow को unlock करें।
        </p>

        <input
            type="password"
            id="enterPin"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter PIN"
            autocomplete="off"
        >

        <button
            type="button"
            onclick="verifyPin()">

            🔓 Unlock

        </button>

        <div class="pin-footer">
            Secure access to your ArthaFlow account
        </div>

    </div>

</div>


<!-- ========================================== -->
<!-- ArthaFlow Cloud Sync -->
<!-- ========================================== -->

<script
type="module"
src="js/cloud-sync.js">
</script>


<!-- ========================================== -->
<!-- Main JavaScript -->
<!-- ========================================== -->

<script
src="js/script.js">
</script>


</body>

</html>
