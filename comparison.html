<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monthly vs Yearly Comparison</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="card">

<h2>📅 Monthly vs Yearly Comparison</h2>

<input
type="number"
id="monthlyIncome"
placeholder="Monthly Income">

<input
type="number"
id="monthlyExpense"
placeholder="Monthly Expense">

<button onclick="calculateComparison()">

📊 Compare

</button>

</div>

<div class="card">

<h2>📈 Comparison Result</h2>

<p>

💰 Monthly Saving :
<span id="monthlySaving">₹0</span>

</p>

<p>

🏦 Yearly Income :
<span id="yearlyIncome">₹0</span>

</p>

<p>

💸 Yearly Expense :
<span id="yearlyExpense">₹0</span>

</p>

<p>

💵 Yearly Saving :
<span id="yearlySaving">₹0</span>

</p>

</div>

  <div class="card">

<h2>📊 Comparison Analytics</h2>

<canvas id="comparisonChart"></canvas>

  </div>

  <div class="card">

<h2>📋 Comparison History</h2>

<ul id="comparisonHistory">

<li>No History</li>

</ul>

  </div>

<script src="js/script.js"></script>

</body>

</html>
